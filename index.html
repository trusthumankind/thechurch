<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>the church</title>
<meta name="description" content="Where missionaries gather to build peace on Earth.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c49a3c;
    --bg: #0a0a0a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
  }

  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Crimson Text', Georgia, serif;
    overflow: hidden;
    position: relative;
  }

  /* Slow ambient glow — the "shimmer," done as a soft breathing
     radial gradient instead of a GIF asset so it stays crisp at
     any size and costs nothing to load. */
  body::before {
    content: "";
    position: absolute;
    inset: -20%;
    background: radial-gradient(circle at 50% 45%, rgba(196, 154, 60, 0.16), transparent 60%);
    animation: breathe 6s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }

  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 1.5rem;
    max-width: 26rem;
  }

  h1 {
    margin: 0;
    font-weight: 400;
    font-size: clamp(2rem, 7vw, 2.75rem);
    color: #f2f2f2;
    letter-spacing: 0.02em;
  }

  h1 .gold {
    display: block;
    white-space: nowrap;
    font-weight: 600;
    background: linear-gradient(100deg, #8a6b26 0%, var(--gold) 30%, #f3d98a 50%, var(--gold) 70%, #8a6b26 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 5s linear infinite;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -20% 0; }
  }

  p.tagline {
    margin: 1.1rem 0 2.6rem;
    font-size: clamp(1.15rem, 4.5vw, 1.4rem);
    font-style: italic;
    color: #8a8a8a;
    letter-spacing: 0.01em;
  }

  a.cta {
    display: inline-block;
    font-family: 'Crimson Text', Georgia, serif;
    font-size: 1.05rem;
    letter-spacing: 0.03em;
    color: #0a0a0a;
    background: var(--gold);
    padding: 0.85rem 2.1rem;
    border-radius: 999px;
    text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 0 0 rgba(196, 154, 60, 0);
  }

  a.cta:active {
    transform: scale(0.97);
  }

  @media (hover: hover) {
    a.cta:hover {
      box-shadow: 0 0 22px rgba(196, 154, 60, 0.45);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    body::before, h1 .gold { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <h1>Welcome to <span class="gold">the church</span></h1>
    <p class="tagline">where missionaries gather<br>to build peace on Earth</p>
    <a class="cta" href="https://discord.gg/2xdup499t">Join us on Discord</a>
  </main>
</body>
</html>
